<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUDIO SPECTGRAPHIC — 音からビジュアルをつくる</title>
<style>
  :root { --ink: #ece6dd; --bg: #05070f; --line: rgba(255,255,255,.14); --paper: #f4f1ec; --navy: #0b1430; --acc: #ff5fd2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; overflow: hidden; }
  button { font: inherit; cursor: pointer; color: inherit; }
  header { position: fixed; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 5; pointer-events: none; }
  .brand b { font-size: 14px; letter-spacing: .24em; font-weight: 600; display: block; }
  .brand span { font-size: 11px; letter-spacing: .14em; opacity: .7; }
  #steps { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; font-size: 11px; letter-spacing: .08em; }
  #steps li { padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); opacity: .5; }
  #steps li.on { opacity: 1; background: var(--paper); color: var(--navy); border-color: var(--paper); }

  /* ---------- 1. 音をあつめる ---------- */
  #listen { position: fixed; inset: 0; }
  #live { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #liveInfo { position: absolute; left: 20px; top: 64px; font-size: 11px; letter-spacing: .1em; opacity: .75; line-height: 1.8; font-variant-numeric: tabular-nums; }
  #liveCtl { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; flex-direction: column; align-items: center; gap: 11px; padding: 0 12px; }
  #status { font-size: 12.5px; letter-spacing: .06em; text-align: center; text-shadow: 0 1px 6px rgba(0,0,0,.8); max-width: 600px; line-height: 1.6; }
  #status.warn { color: #ffc9b8; }
  .btnpair { display: contents; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .chip { font-size: 12.5px; letter-spacing: .05em; background: rgba(9,15,38,.6); border: 1px solid rgba(255,255,255,.24);
          border-radius: 999px; padding: 7px 14px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .chip.on { background: var(--paper); color: var(--navy); border-color: var(--paper); }
  #capture { width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--paper); background: rgba(232, 80, 70, .92); color: #fff; white-space: nowrap;
             font-size: 12px; letter-spacing: .02em; box-shadow: 0 0 0 6px rgba(244,241,236,.12), 0 10px 30px rgba(0,0,0,.4); }
  #capture:active { transform: scale(.96); }
  #capture[disabled] { opacity: .35; cursor: default; }
  #shots { display: flex; gap: 8px; align-items: center; min-height: 46px; }
  .shot { position: relative; width: 72px; height: 44px; border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.4); animation: pop .35s ease; }
  .shot svg { width: 100%; height: 100%; display: block; }
  .shot button { position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; border: none; background: rgba(0,0,0,.65); font-size: 11px; line-height: 16px; padding: 0; }
  .shot.empty { border-style: dashed; opacity: .35; animation: none; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .primary { background: var(--paper); color: var(--navy); border: none; border-radius: 999px; padding: 11px 22px; font-size: 14px; letter-spacing: .08em; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
  .primary[disabled] { opacity: .35; cursor: default; }
  .ghost { background: rgba(9,15,38,.5); border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 10px 18px; font-size: 13px; letter-spacing: .06em; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #startOverlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(3,5,12,.55); z-index: 3; }
  #startOverlay .box { text-align: center; padding: 0 20px; }
  #startOverlay h1 { font-size: 22px; letter-spacing: .3em; font-weight: 600; margin: 0 0 6px; }
  #startOverlay h2 { font-size: 13px; letter-spacing: .2em; font-weight: 400; margin: 0 0 18px; opacity: .8; }
  body.intro #liveCtl, body.intro #liveInfo { visibility: hidden; }   /* はじめる前は説明とボタンだけ */
  #startOverlay .big { font-size: 16px; padding: 14px 44px; letter-spacing: .2em; }
  .grp { font-size: 11px; letter-spacing: .12em; opacity: .6; margin-right: 2px; }
  .sep { width: 1px; height: 22px; background: rgba(255,255,255,.25); margin: 0 6px; }
  .chip.mine { border-style: dashed; }
  .chip.mine.on { border-style: solid; }
  #startOverlay p { font-size: 13px; line-height: 1.9; opacity: .85; margin: 0 0 26px; letter-spacing: .05em; }

  /* ---------- 2. つくる ---------- */
  #design { position: fixed; inset: 0; display: none; grid-template-columns: 1fr 340px; }
  #design.show { display: grid; }
  #stageWrap { display: flex; align-items: center; justify-content: center; padding: 64px 28px 28px; min-width: 0; min-height: 0; }
  #art { max-width: 100%; max-height: 100%; border-radius: 4px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.5); line-height: 0; }
  #art svg { width: 100%; height: 100%; display: block; }
  #panel { background: rgba(10, 14, 30, .94); border-left: 1px solid var(--line); padding: 64px 18px 24px; overflow-y: auto; }
  #panel h3 { font-size: 11px; letter-spacing: .2em; font-weight: 600; opacity: .6; margin: 20px 0 9px; display: flex; justify-content: space-between; align-items: center; }
  #panel h3 small { font-size: 10.5px; letter-spacing: .06em; font-weight: 400; }
  .bigrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  #dice { background: linear-gradient(135deg, #ff2bd6, #ffb02b 50%, #2be7ff); color: #0b0b14; border: none; border-radius: 12px; padding: 12px; font-size: 15px; font-weight: 700; letter-spacing: .12em; }
  #dice:active { transform: scale(.98); }
  #undo { border-radius: 12px; padding: 0 14px; background: rgba(255,255,255,.06); border: 1px solid var(--line); font-size: 13px; }
  #undo[disabled] { opacity: .35; cursor: default; }
  .seg { display: grid; gap: 3px; background: rgba(255,255,255,.06); border-radius: 9px; padding: 3px; }
  .seg button { background: none; border: none; font-size: 12px; padding: 8px 2px; border-radius: 7px; letter-spacing: .03em; }
  .seg button.on { background: var(--paper); color: var(--navy); }
  #aspect button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 2px 7px; }
  #aspect .ar { display: block; border: 1.5px solid currentColor; border-radius: 2px; }
  #aspect small { font-size: 9.5px; opacity: .6; letter-spacing: .04em; }
  .seg button[disabled] { opacity: .3; cursor: default; }
  .layer { display: grid; grid-template-columns: 26px 1fr auto auto auto; align-items: center; gap: 6px; padding: 7px; border-radius: 9px; background: rgba(255,255,255,.04); margin-bottom: 6px; }
  .layer.off { opacity: .45; }
  .layer .sw { width: 26px; height: 26px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,.35); padding: 0; }
  .layer .lt { min-width: 0; }
  .layer .lt svg { width: 100%; height: 26px; display: block; }
  .layer .lt span { display: block; font-size: 10px; opacity: .6; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .layer .ib { width: 26px; height: 26px; border-radius: 6px; border: none; background: rgba(255,255,255,.07); font-size: 12px; padding: 0; }
  .layer input[type=range] { grid-column: 1 / -1; }
  .pals { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; padding-top: 4px; }
  .pals button { aspect-ratio: 1 / 1; border-radius: 6px; border: 1.5px solid rgba(255,255,255,.2); padding: 0; }
  .pals button.on { border-color: #fff; box-shadow: 0 0 0 1px #000 inset; }
  #addSound { font-size: 11px; padding: 4px 10px; border-radius: 999px; background: none; border: 1px solid var(--line); letter-spacing: .04em; opacity: .9; }
  #bgs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .slider.sl2 { grid-template-columns: 40px 1fr; margin-top: 12px; }
  .ticks { display: flex; justify-content: space-between; font-size: 10.5px; opacity: .55; padding: 2px 0 0 48px; }
  #bgs button { position: relative; aspect-ratio: 1 / 1; border-radius: 8px; border: 2px solid transparent; padding: 0; overflow: hidden; }
  #bgs button.on { border-color: #fff; }
  #bgs button span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 9.5px; padding: 2px 0; background: rgba(0,0,0,.45); color: #fff; letter-spacing: .04em; }
  #bgs button.rainbow { background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 35%, rgba(0,0,0,.85)), linear-gradient(to right, #ff3b3b, #ffd23b, #4dff5a, #3bf0ff, #3b5bff, #e23bff, #ff3b3b); }
  #bgs button.rainbow i { position: absolute; right: 4px; top: 4px; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
  #imgPanel { display: none; margin-top: 10px; padding: 8px; border-radius: 10px; background: rgba(255,255,255,.05); }
  #imgPanel.show { display: block; }
  #imgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #imgs button { position: relative; aspect-ratio: 16 / 10; border-radius: 7px; border: 2px solid transparent; padding: 0; background-size: cover; background-position: center; overflow: hidden; }
  #imgs button.on { border-color: #fff; }
  #imgs button span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 9.5px; padding: 2px 0; background: rgba(0,0,0,.45); color: #fff; letter-spacing: .04em; }
  #imgs button.add { border: 1.5px dashed rgba(255,255,255,.35); background: rgba(255,255,255,.04); font-size: 10.5px; letter-spacing: .04em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  #imgs button.add b { font-size: 16px; font-weight: 400; line-height: 1; }
  #picker { display: none; margin-top: 10px; padding: 10px; border-radius: 10px; background: rgba(255,255,255,.05); }
  #picker.show { display: block; }
  #sv { position: relative; height: 150px; border-radius: 7px; cursor: crosshair; touch-action: none; }
  #hue { position: relative; height: 16px; margin-top: 10px; border-radius: 999px; cursor: pointer; touch-action: none;
         background: linear-gradient(to right, #f00, #ff0 16.66%, #0f0 33.33%, #0ff 50%, #00f 66.66%, #f0f 83.33%, #f00); }
  .knob { position: absolute; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4); transform: translate(-50%, -50%); pointer-events: none; }
  #hue .knob { top: 50%; }
  .hexrow { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: center; margin-top: 10px; }
  .hexrow i { width: 28px; height: 28px; border-radius: 6px; border: 1px solid rgba(255,255,255,.3); }
  #hex { font: inherit; font-size: 13px; letter-spacing: .06em; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--ink); width: 100%; text-transform: uppercase; }
  #fx { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  #fx button { font-size: 12px; padding: 8px 2px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.04); letter-spacing: .03em; }
  #fx button.on { background: var(--paper); color: var(--navy); border-color: var(--paper); }
  #fx button[disabled] { opacity: .28; cursor: default; background: rgba(255,255,255,.04); color: var(--ink); border-color: var(--line); }
  input[type=range] { width: 100%; accent-color: var(--paper); }
  .slider { display: grid; grid-template-columns: 40px 1fr 30px; align-items: center; gap: 8px; font-size: 12px; margin: 10px 0 0; }
  .slider output { font-size: 11px; opacity: .7; text-align: right; font-variant-numeric: tabular-nums; }
  #name { width: 100%; font: inherit; font-size: 14px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--ink); }
  .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 22px; }
  #done { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(3,5,12,.72); z-index: 20; padding: 20px; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  #done.show { display: flex; }
  #done .card { width: min(560px, 100%); background: #0e1326; border: 1px solid var(--line); border-radius: 16px; padding: 18px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  #done .pv { background: #000; border-radius: 8px; overflow: hidden; line-height: 0; min-height: 120px; display: flex; align-items: center; justify-content: center; }
  #done .pv img { max-width: 100%; max-height: 52vh; display: block; }
  #done h2 { font-size: 20px; letter-spacing: .3em; margin: 16px 0 14px; font-weight: 600; }
  #done .btns { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; }
  #done .btns button { padding: 12px 8px; font-size: 14px; }
  #done .note { font-size: 11.5px; line-height: 1.7; opacity: .7; margin: 12px 0 0; min-height: 1.7em; letter-spacing: .04em; }
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: var(--paper); color: var(--navy); font-size: 13px;
           padding: 10px 18px; border-radius: 999px; opacity: 0; transition: .3s; pointer-events: none; z-index: 10; letter-spacing: .04em; text-align: center; max-width: 90vw; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  body.designing header { right: 340px; }   /* つくる画面ではパネルに重ならないように */
  body.designing #panel { padding-top: 18px; }
  @media (max-width: 600px) {   /* スマホ：キャプチャ欄は1段目、ボタンは2段目に */
    #capRow { flex-direction: column; gap: 10px; }
    #shots { width: 100%; justify-content: center; gap: 6px; }
    .shot { width: calc((100vw - 48px) / 5); max-width: 72px; height: auto; aspect-ratio: 72 / 44; }
    #capRow .btnpair { display: flex; gap: 12px; align-items: center; }
    #liveCtl { bottom: 12px; gap: 9px; }
    #srcRow { gap: 6px; }
    #srcRow .chip { padding: 6px 12px; }
    #startOverlay h1 { font-size: 18px; letter-spacing: .22em; }
    header { padding: 0 14px; }
    .brand b { font-size: 12px; letter-spacing: .16em; }
    .brand span { font-size: 10px; }
    #steps li { white-space: nowrap; font-size: 10.5px; padding: 4px 9px; }
    .sep { flex-basis: 100%; height: 0; margin: 0; background: none; }   /* 自分の声・ファイルは2段目に */
    #status { font-size: 12px; }
    #done .btns { grid-template-columns: 1fr 1fr 1fr; }
  }
  @media (max-width: 860px) {
    body.designing header { right: 0; }
    html, body { overflow: auto; }
    #design { grid-template-columns: 1fr; grid-template-rows: auto auto; overflow-y: auto; position: absolute; min-height: 100%; }
    #stageWrap { padding: 64px 10px 10px; }
    #panel { border-left: none; border-top: 1px solid var(--line); padding: 14px 16px 40px; }
    #steps li:not(.on) { display: none; }
  }
</style>
</head>
<body class="intro">
<header>
  <div class="brand"><b>AUDIO SPECTGRAPHIC</b><span>音からビジュアルをつくる</span></div>
  <ol id="steps"><li class="on">1 音をあつめる</li><li>2 つくる</li><li>3 完成</li></ol>
</header>

<section id="listen">
  <canvas id="live"></canvas>
  <div id="liveInfo"></div>
  <div id="flash"></div>
  <div id="liveCtl">
    <div id="status">音を選んでください</div>
    <div class="row" id="srcRow">
      <span class="grp">サンプル</span>
      <button class="chip" data-src="bell">鐘</button>
      <button class="chip" data-src="wind">風</button>
      <button class="chip" data-src="fire">花火</button>
      <button class="chip" data-src="bird">鳥</button>
      <i class="sep"></i>
      <button class="chip mine" data-src="mic">自分の声</button>
      <button class="chip mine" data-src="file">ファイル</button>
    </div>
    <div class="row" id="capRow">
      <div id="shots"></div>
      <div class="btnpair">
        <button id="capture" disabled>キャプチャ</button>
        <button class="primary" id="toDesign" disabled>つくる →</button>
      </div>
    </div>
  </div>
  <div id="startOverlay">
    <div class="box">
      <h1>AUDIO SPECTGRAPHIC</h1>
      <h2>音からビジュアルをつくる</h2>
      <p>音を鳴らすと、低い音から高い音までの大きさ（スペクトラム）がリアルタイムに動きます。<br>好きな瞬間をキャプチャして重ね、色やかたちを組み合わせて、1枚のビジュアルにします。</p>
      <button class="primary big" id="startBtn">はじめる</button>
    </div>
  </div>
  <input type="file" id="file" accept="audio/*" hidden>
</section>

<section id="design">
  <div id="stageWrap"><div id="art"></div></div>
  <aside id="panel">
    <div class="bigrow"><button id="dice">ランダム</button><button id="undo" disabled title="ひとつ前に戻す（Ctrl/⌘+Z）">元に戻す</button></div>
    <h3>レイヤー <small id="layerCount"></small><button id="addSound">＋ 音を足す</button></h3>
    <div id="layers"></div>
    <h3>かたち</h3>
    <div class="seg" id="layout" style="grid-template-columns: repeat(3, 1fr)"></div>
    <label class="slider sl2"><span>距離</span><input type="range" id="zoom" min="0" max="1" step="0.005"></label>
    <div class="ticks"><span>遠い</span><span>近い</span></div>
    <h3>描きかた</h3>
    <div class="seg" id="style" style="grid-template-columns: repeat(5, 1fr)"></div>
    <label class="slider">本数<input type="range" id="count" min="16" max="200" step="1"><output id="countOut"></output></label>
    <h3>背景</h3>
    <div id="bgs"></div>
    <div id="skyCtl">
      <label class="slider sl2"><span>時間</span><input type="range" id="time" min="0" max="1" step="0.005"></label>
      <div class="ticks"><span>朝</span><span>昼</span><span>夕</span><span>夜</span></div>
      <label class="slider sl2"><span>天気</span><input type="range" id="weather" min="0" max="1" step="0.01"></label>
      <div class="ticks"><span>晴れ</span><span>くもり</span></div>
    </div>
    <div id="imgPanel"><div id="imgs"></div></div>
    <div id="picker">
      <div id="sv"><div class="knob" id="svKnob"></div></div>
      <div id="hue"><div class="knob" id="hueKnob"></div></div>
      <div class="hexrow"><i id="hexSw"></i><input id="hex" maxlength="7" spellcheck="false"></div>
    </div>
    <h3>エフェクト</h3>
    <div id="fx"></div>
    <h3>キャンバス</h3>
    <div class="seg" id="aspect" style="grid-template-columns: repeat(3, 1fr)"></div>
    <h3>タイトル <small>画像の左下に入ります</small></h3>
    <input id="name" maxlength="24" placeholder="なし">
    <div class="actions">
      <button class="primary" id="save">完成！</button>
    </div>
  </aside>
</section>
<input type="file" id="bgFile" accept="image/*" hidden>
<div id="done">
  <div class="card">
    <div class="pv"><img id="donePv" alt="完成したビジュアル"></div>
    <h2>完成！</h2>
    <div class="btns">
      <button class="primary" id="dSave">保存</button>
      <button class="ghost" id="dPost">投稿</button>
      <button class="ghost" id="dBack">戻る</button>
    </div>
    <p class="note" id="dNote"></p>
  </div>
</div>
<div id="toast"></div>

<script>
// =====================================================
//  AUDIO SPECTGRAPHIC（音からビジュアルをつくる）
//  1. 音のスペクトラムがリアルタイムに動く。好きな瞬間をキャプチャ（最大5つ）
//  2. キャプチャを重ねて、色・かたち・バー・背景・エフェクトを組み合わせる
//     「ランダム」で色やエフェクトを配置しなおせる
//  描画はSVGなので、そのまま印刷用のベクターデータにもなる
// =====================================================
const F_MIN = 80, F_MAX = 12000;
const K = 480;              // スペクトラムの点の数（周波数を対数で480分割）
const NBAR = 100;           // ライブ画面の棒の本数
const ASPECT = 243.7 / 966.7;  // 高さ1.0 ÷ 横幅（地平線のかたち）
const MAXL = 5;             // キャプチャできる数
const CFG = { fft: 4096, smooth: 0.3, lerp: 0.7, hold: 0.12 };   // 解析の窓・なめらかさ・画面の追従／隠し波形の長さ(秒)
const KF = Array.from({ length: K }, (_, k) => F_MIN * Math.pow(F_MAX / F_MIN, (k + 0.5) / K));
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };

// =====================================================
//  スペクトラム → 山並み（山っぽくする工夫）
// =====================================================
const SLOPE = 4.5;    // ① 傾き補正 dB/オクターブ：自然な音は高音ほど弱いので、持ち上げて山並みを横に広げる
const RANGE = 42;     // ③ 山の高さに使うdBの幅
const CURVE = 1.6;    // ④ 高さのカーブ：裾野を広く、峰を鋭く
function movAvg(v, r) {
  if (r < 1) return v.slice();
  const out = new Array(v.length);
  for (let i = 0; i < v.length; i++) { let s = 0, n = 0; for (let k = -r; k <= r; k++) { const j = i + k; if (j >= 0 && j < v.length) { s += v[j]; n++; } } out[i] = s / n; }
  return out;
}
function coneMax(v, slope, r) {      // 各頂点から斜面を下ろした「円錐」の重なりの上端
  return v.map((_, i) => { let m = -Infinity; for (let k = -r; k <= r; k++) { const j = i + k; if (j >= 0 && j < v.length) { const c = v[j] - slope * Math.abs(k); if (c > m) m = c; } } return m; });
}
function toMountain(db) {
  const t = db.map((d, k) => d + SLOPE * Math.log2(KF[k] / 1000));         // ① 傾き補正
  const ridge = movAvg(coneMax(t, 0.45, 90), 2);                            // ② 倍音ひとつひとつを峰にして斜面でつなぐ
  const fine = movAvg(t, 1);
  const s = ridge.map((e, k) => e + 0.5 * clamp(fine[k] - e, -10, 0));       //    稜線より低いところだけ少し削って岩肌に
  const top = Math.max(...s);
  let h = s.map(v => Math.pow(clamp((v - (top - RANGE)) / RANGE), CURVE));  // ③④
  const m = Math.max(...h) || 1;
  return h.map(v => v / m);
}
function barsFrom(curve, n) {
  const out = [];
  for (let b = 0; b < n; b++) {
    const a = Math.floor(b * curve.length / n), z = Math.max(a + 1, Math.floor((b + 1) * curve.length / n));
    let s = 0; for (let k = a; k < z; k++) s += curve[k]; out.push(s / (z - a));
  }
  return out;
}

function skyAt(t) {
  let i = 0; while (i < SKY_KEYS.length - 2 && t > SKY_KEYS[i + 1].t) i++;
  const a = SKY_KEYS[i], b = SKY_KEYS[i + 1], k = clamp((t - a.t) / (b.t - a.t)), m = (x, y) => mixC(x, y, k);
  return { sky: a.sky.map((c, j) => m(c, b.sky[j])), ground: a.ground.map((c, j) => m(c, b.ground[j])), ink: m(a.ink, b.ink), cap: '#ffffff', dark: true, lum: a.lum + (b.lum - a.lum) * k };
}

function customBG(c) {
  const [r, g, b] = hex2(c), lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255, dark = lum < 0.6;
  return { n: '好きな色', sky: [mixC(c, '#000000', 0.18), c, mixC(c, '#ffffff', 0.12)], ground: [mixC(c, '#000000', 0.22), mixC(c, '#000000', 0.5)],

  if (radial) {
    let ext = 0.7; vis.forEach(L => { ext = Math.max(ext, 0.4 + 0.6 * L.h * (fx.echo ? 1.24 : 1) + (fx.peak ? 0.02 : 0)); });
    maxR = Math.min(W, H) * 0.48 / ext; r0 = maxR * 0.4; rLen = maxR - r0;
  }
  // 多角形：音の数で形が変わる（1つ→四角に4つ、2つ→向かい合わせ、3つ→三角形…）
  const PG = poly ? polyFrames(vis.length, W, H) : null;
  if (PG) { cx = PG.cx; cy = PG.cy; }
  // 距離：近いほど大きく。地平線は水平線の中央、円・多角形は中心を基準に拡大（空・星・地平線の太陽はそのまま）
  const z = S.zoom || 1, ax = horiz ? W / 2 : cx, ay = horiz ? hy : cy;
  const zt = `translate(${f(ax)} ${f(ay)}) scale(${f(z)}) translate(${f(-ax)} ${f(-ay)})`;
  const R = Math.min(H - hy, unitH * 1.08 * z);   // 反射の長さ
  const s = [], d = [];
  const capLine = 0.62;
  const capFrom = (i, unit) => (capLine - Math.pow(hash(i), 3) * 0.3 - hash(i * 3.7) * 0.06) * unit;

  // ---------- 定義 ----------
  d.push(`<linearGradient id="${id}sky" x1="0" y1="0" x2="0" y2="${floor ? hy : H}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${BG.sky[0]}"/><stop offset="0.6" stop-color="${BG.sky[1]}"/><stop offset="1" stop-color="${BG.sky[2]}"/></linearGradient>`);
  d.push(`<linearGradient id="${id}gnd" x1="0" y1="${hy}" x2="0" y2="${H}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${BG.ground[0]}"/><stop offset="1" stop-color="${BG.ground[1]}"/></linearGradient>`);
  if (fx.glow || fx.ink) {   // にじみ＋グローを1つのフィルターにまとめる
    let fl = `<filter id="${id}fxs" x="-3%" y="-6%" width="106%" height="112%">`, src = 'SourceGraphic';
    if (fx.ink) { fl += `<feTurbulence type="fractalNoise" baseFrequency="0.035 0.16" numOctaves="3" seed="4" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="${f(9 * u)}" xChannelSelector="R" yChannelSelector="G" result="dd"/><feGaussianBlur in="dd" stdDeviation="${f(0.8 * u)}" result="ink"/>`; src = 'ink'; }
    if (fx.glow) fl += `<feGaussianBlur in="${src}" stdDeviation="${f(4 * u)}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="${src}"/></feMerge>`;
    d.push(fl + '</filter>');
  }
  if (fx.grain) d.push(`<pattern id="${id}grain" width="256" height="256" patternUnits="userSpaceOnUse"><image href="${grainTile(dark)}" xlink:href="${grainTile(dark)}" width="256" height="256"/></pattern>`);
  if (fx.scan) d.push(`<pattern id="${id}scan" width="${W}" height="${f(4 * u)}" patternUnits="userSpaceOnUse"><rect width="${W}" height="${f(1.3 * u)}" fill="#000" opacity="${dark ? 0.35 : 0.08}"/></pattern>`);
  if (fx.sun) d.push(`<linearGradient id="${id}sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe46b"/><stop offset="1" stop-color="${acc[0]}"/></linearGradient>`);
  if (refl) {
    d.push(`<linearGradient id="${id}fade" x1="0" y1="${hy}" x2="0" y2="${f(hy + R)}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset="0.6" stop-color="#fff" stop-opacity="0.7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>`);
    d.push(`<mask id="${id}fm" maskUnits="userSpaceOnUse" x="0" y="${hy}" width="${W}" height="${f(R)}"><rect x="0" y="${hy}" width="${W}" height="${f(R)}" fill="url(#${id}fade)"/></mask>`);
    let c = `<clipPath id="${id}rip">`;
    for (let y = hy + 1.5 * u, k = 0; y < hy + R; k++) { const p = (3.2 + k * 0.16) * u; c += `<rect x="0" y="${f(y)}" width="${W}" height="${f(p * 0.7)}"/>`; y += p; }
    d.push(c + '</clipPath>');
  }
  // レイヤー（多角形は辺ごと）のグラデーション
  if (poly) PG.frames.forEach(F => {
    const L = vis[F.j], c = PALS[L.pal].c, [x1, y1] = F.M, x2 = x1 + F.nrm[0] * F.L * L.h, y2 = y1 + F.nrm[1] * F.L * L.h;
    d.push(`<linearGradient id="${id}q${F.k}" x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient>`);
  });
  else vis.forEach((L, j) => {
    const c = PALS[L.pal].c;
    if (radial) d.push(`<radialGradient id="${id}g${j}" cx="${f(cx)}" cy="${f(cy)}" r="${f(r0 + rLen * L.h)}" gradientUnits="userSpaceOnUse"><stop offset="${f(r0 / (r0 + rLen * L.h))}" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></radialGradient>`);
    else d.push(`<linearGradient id="${id}g${j}" x1="0" y1="${hy}" x2="0" y2="${f(hy - unitH * L.h)}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient>`);
  });

  // ---------- 背景 ----------
  if (S.bg === 'photo') {
    const src = (IMG[S.bgPick] || IMG.milkyway).src;
    s.push(`<image href="${src}" xlink:href="${src}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="xMidYMid slice"/>`);
    s.push(`<rect width="${W}" height="${H}" fill="${dark ? '#000' : '#fff'}" opacity="${dark ? 0.22 : 0.08}"/>`);   // 図形が見やすいように少しだけ暗く（明るい画像は少し白く）
    if (dim < 1) s.push(`<rect width="${W}" height="${H}" fill="#8f95a3" opacity="${f(0.5 * (1 - dim))}"/>`);   // 天気：くもり
  } else {
    s.push(floor ? `<rect width="${W}" height="${hy}" fill="url(#${id}sky)"/><rect y="${hy}" width="${W}" height="${H - hy}" fill="url(#${id}gnd)"/>` : `<rect width="${W}" height="${H}" fill="url(#${id}sky)"/>`);
  }
  if (fx.stars && dim > 0.02) {
    const r = mulberry(7), col = dark ? mixC(acc[1], '#ffffff', 0.4) : BG.ink, halo = fx.glow && dark;
    let core = '', soft = '';
    for (let k = 0; k < 46; k++) {
      const x = r() * W, y = r() * (floor ? hy * 0.8 : H), a = (1.5 + r() * 3) * u, t = 0.5 * u;
      core += `M${f(x - a)},${f(y - t / 2)}h${f(2 * a)}v${f(t)}h${f(-2 * a)}Z M${f(x - t / 2)},${f(y - a)}h${f(t)}v${f(2 * a)}h${f(-t)}Z `;
      if (halo) soft += `M${f(x + 3 * u)},${f(y)}a${f(3 * u)},${f(3 * u)} 0 1 0 ${f(-6 * u)},0a${f(3 * u)},${f(3 * u)} 0 1 0 ${f(6 * u)},0Z `;
    }
    if (halo) s.push(`<path d="${soft}" fill="${col}" opacity="${f(0.18 * dim)}"/>`);
    s.push(`<path d="${core}" fill="${col}" opacity="${f((dark ? 0.8 : 0.35) * dim)}"/>`);
  }
  // 太陽：地平線では水平線より下にはみ出さず、反射にも映る。円・多角形では中央に
  let sunSvg = '', innerSun = '';
  if (fx.sun && dim > 0.02) {
    let sr = radial ? r0 * 0.78 : poly ? PG.sun : Math.min(W, H) * 0.085, sx = horiz ? W * S.sunX : cx, sy = horiz ? hy - sr * 0.32 : cy;
    if (horiz) {   // 地平線では時間で太陽が動く：朝は左の水平線から昇り、昼にいちばん高く、夕方に右へ沈み、夜は見えない
      const p = clamp(S.time / 0.667), arc = Math.sin(Math.PI * p), set = sstep(0.667, 0.85, S.time);
      sr *= 1 - 0.3 * arc;
      sx = W * (0.12 + 0.76 * p);
      sy = hy + sr * 0.15 - arc * hy * 0.6 + set * sr * 2.4;
    }
    if (dark) {
      let c = `<clipPath id="${id}slit"><rect x="${f(sx - sr)}" y="${f(sy - sr)}" width="${f(2 * sr)}" height="${f(sr * 1.05)}"/>`;
      for (let k = 0, y = sy + sr * 0.05; y < sy + sr; k++) { const g = sr * (0.03 + k * 0.025); c += `<rect x="${f(sx - sr)}" y="${f(y)}" width="${f(2 * sr)}" height="${f(Math.max(0.5, sr * 0.11 - g))}"/>`; y += sr * 0.11 + g * 0.3; }
      d.push(c + '</clipPath>');
      if (fx.glow) { d.push(`<radialGradient id="${id}halo"><stop offset="0.6" stop-color="${acc[0]}" stop-opacity="0.4"/><stop offset="1" stop-color="${acc[0]}" stop-opacity="0"/></radialGradient>`);
                               sunSvg += `<circle cx="${f(sx)}" cy="${f(sy)}" r="${f(sr * (horiz ? 1.45 : 1.25))}" fill="url(#${id}halo)"/>`; }
      sunSvg += `<circle cx="${f(sx)}" cy="${f(sy)}" r="${f(sr)}" fill="url(#${id}sun)" clip-path="url(#${id}slit)"/>`;
    } else sunSvg += `<circle cx="${f(sx)}" cy="${f(sy)}" r="${f(sr * 0.9)}" fill="#d6402c" opacity="0.92"/>`;
    if (horiz) { d.push(`<clipPath id="${id}hz"><rect x="0" y="0" width="${W}" height="${hy}"/></clipPath>`); sunSvg = `<g clip-path="url(#${id}hz)" opacity="${f(dim)}">${sunSvg}</g>`; }
    else { innerSun = `<g opacity="${f(dim)}">${sunSvg}</g>`; sunSvg = ''; }   // 円・多角形の太陽は図形と一緒に拡大
  }
  if (fx.grid && floor) {
    const gc = dark ? acc[0] : BG.ink;
    s.push(`<g stroke="${gc}" stroke-width="${f(0.9 * u)}" opacity="${dark ? 0.35 : 0.18}">`);
    for (let k = -14; k <= 14; k++) s.push(`<line x1="${f(W / 2 + k * W * 0.012)}" y1="${hy}" x2="${f(W / 2 + k * W * 0.16)}" y2="${H}"/>`);
    for (let k = 1, y = hy; y < H; k++) { y = hy + (H - hy) * Math.pow(k / 14, 1.8); s.push(`<line x1="0" y1="${f(y)}" x2="${W}" y2="${f(y)}"/>`); }
    s.push('</g>');
  }

  // ---------- 本体（奥から順に） ----------
  const G = { W, H, hy, u, f, n, bw, mx, span, unitH, cx, cy, r0, rLen, capFrom, center: false, radial, style: S.style, cap: fx.cap ? BG.cap : null, peak: fx.peak, dark, ink: BG.ink };
  const peakC = top => G.peak ? (dark ? mixC(top, '#ffffff', 0.5) : top) : null;
  let subj = '';
  if (poly) {
    d.push(`<clipPath id="${id}pc"><path d="M${PG.verts.map(v => f(v[0]) + ',' + f(v[1])).join('L')}Z"/></clipPath>`);   // 多角形の内側だけに
    subj += `<g clip-path="url(#${id}pc)">`;
    for (let q = PG.frames.length - 1; q >= 0; q--) {
      const F = PG.frames[q], L = vis[F.j], vals = barsFrom(L.curve, n), top = PALS[L.pal].c[1], fill = `url(#${id}q${F.k})`;
      if (fx.echo) subj += `<g opacity="0.12">${shapesSide(G, F, vals, L.h * 1.24, top, null, null, L.curve)}</g><g opacity="0.25">${shapesSide(G, F, vals, L.h * 1.12, top, null, null, L.curve)}</g>`;
      subj += shapesSide(G, F, vals, L.h, fill, G.cap, peakC(top), L.curve);
    }
    subj += '</g>';
  } else {
    for (let j = vis.length - 1; j >= 0; j--) {
      const L = vis[j], vals = barsFrom(L.curve, n), fill = `url(#${id}g${j})`, top = PALS[L.pal].c[1];
      if (fx.echo) { subj += `<g opacity="0.12">${shapes(G, vals, L.h * 1.24, top, false, false)}</g><g opacity="0.25">${shapes(G, vals, L.h * 1.12, top, false, false)}</g>`; }
      subj += shapes(G, vals, L.h, fill, G.cap, peakC(top), L.curve);
    }
  }
  subj = sunSvg + (z !== 1 ? `<g transform="${zt}">${innerSun}${subj}</g>` : innerSun + subj);
  const mir = refl ? `<g mask="url(#${id}fm)" opacity="${dark ? 0.5 : 0.3}"><g clip-path="url(#${id}rip)"><use xlink:href="#${id}subj" href="#${id}subj" transform="translate(0 ${2 * hy}) scale(1 -1)"/></g></g>` : '';
  s.push(`<g id="${id}subj"${fx.glow || fx.ink ? ` filter="url(#${id}fxs)"` : ''}>${subj}</g>${mir}`);   // 反射は効果をかけた本体（太陽も）をそのまま映す

  // ---------- 目盛り ----------
  const glowLine = fx.glow && dark, hc = glowLine ? acc[1] : BG.ink;
  const ticks = (len, at) => {   // 周波数の目盛り：100・200・500…は数字つき、その間は短い線だけ
    let t = '';
    for (const dec of [100, 1000, 10000]) for (let m = 1; m <= 9; m++) {
      const fq = dec * m; if (fq < F_MIN || fq > F_MAX) continue;
      const pos = Math.log(fq / F_MIN) / Math.log(F_MAX / F_MIN), major = m === 1 || m === 2 || m === 5;
      t += at(pos, major ? len : len * 0.55, major ? (fq >= 1000 ? fq / 1000 + 'k' + (m === 1 && dec === 1000 ? 'Hz' : '') : fq + (fq === 100 ? 'Hz' : '')) : '');
    }
    return t;
  };
  if (fx.axis && horiz) {
    if (glowLine) s.push(`<rect x="0" y="${f(hy - 3 * u)}" width="${W}" height="${f(6 * u)}" fill="${hc}" opacity="0.22"/>`);
    s.push(`<rect x="0" y="${f(hy - 0.5 * u)}" width="${W}" height="${f(u)}" fill="${hc}" opacity="${glowLine ? 0.95 : 0.45}"/>`);
    s.push(`<g fill="${hc}" opacity="0.7" font-family="Helvetica Neue, Arial, sans-serif" font-size="${f(10.5 * u)}" text-anchor="middle" letter-spacing="${f(0.4 * u)}">`);
    s.push(ticks(7 * u, (pos, len, label) => { const x = ax + (mx + span * pos - ax) * z; if (x < 6 * u || x > W - 6 * u) return ''; return `<rect x="${f(x - 0.5 * u)}" y="${f(hy + 3 * u)}" width="${f(u)}" height="${f(len)}"/>` + (label ? `<text x="${f(x)}" y="${f(hy + 22 * u)}">${label}</text>` : ''); }));
    s.push('</g>');
  }
  if (fx.axis && poly) {   // 多角形：各辺を線で引き、外側に目盛り
    let lines = '', tk = '';
    PG.frames.forEach(F => {
      const [Mx, My] = F.M, [dx, dy] = F.dir, [nx, ny] = F.nrm, P = (sp, h) => [Mx + dx * sp + nx * h, My + dy * sp + ny * h];
      const a = P(-F.sl / 2, 0), b = P(F.sl / 2, 0); lines += `M${f(a[0])},${f(a[1])}L${f(b[0])},${f(b[1])}`;
      tk += ticks(7 * u, (pos, len) => { const p0 = P(pos * F.sl - F.sl / 2, 0), p1 = P(pos * F.sl - F.sl / 2, -len); return `M${f(p0[0])},${f(p0[1])}L${f(p1[0])},${f(p1[1])}`; });
    });
    s.push(`<g transform="${zt}"><path d="${lines}" stroke="${hc}" stroke-width="${f(u)}" vector-effect="non-scaling-stroke" opacity="${glowLine ? 0.9 : 0.45}" fill="none"/><path d="${tk}" stroke="${hc}" stroke-width="${f(0.8 * u)}" vector-effect="non-scaling-stroke" opacity="0.6" fill="none"/></g>`);
  }
  if (fx.scan) s.push(`<rect width="${W}" height="${H}" fill="url(#${id}scan)"/>`);
  if (fx.grain) s.push(`<rect width="${W}" height="${H}" fill="url(#${id}grain)"/>`);
  if (o.caption && S.name) s.push(`<text x="${f(W * 0.04)}" y="${f(H - 36 * u)}" fill="${BG.ink}" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="${f(26 * u)}" font-weight="600" letter-spacing="${f(3 * u)}">${esc(S.name)}</text>`);
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${W} ${H}"${o.size ? ` width="${W}" height="${H}"` : ''}><defs>${d.join('')}</defs>${s.join('')}</svg>`;
}

// ---------- 多角形の辺 ----------
// 辺ごとに「基準点M・辺の向きdir・内向きnrm・辺の長さsl・山の最大の高さL・どのレイヤーj」を返す
function polyFrames(nv, W, H) {
  if (nv === 2) {   // 2つ：向かい合わせ（上の辺は180°回したもの）。3つ以上：正多角形の各辺から内側へ
    const D = Math.min(H * 0.8, W * 0.62), sl = W * 0.92, L = D * 0.64;
    const x0 = (W - sl) / 2, x1 = (W + sl) / 2, y0 = (H - D) / 2, y1 = (H + D) / 2;
    return { cx: W / 2, cy: H / 2, sun: D * 0.26, verts: [[x0, y0], [x1, y0], [x1, y1], [x0, y1]], frames: [
      { k: 0, j: 0, M: [W / 2, H / 2 + D / 2], dir: [1, 0], nrm: [0, -1], sl, L },
      { k: 1, j: 1, M: [W / 2, H / 2 - D / 2], dir: [-1, 0], nrm: [0, 1], sl, L } ] };
  }
  const nn = nv <= 1 ? 6 : nv, a = Math.PI / nn;   // 1つなら：六角形の6辺に、左右対称にした同じ山を置く（雪の結晶のような形）
  const phis = Array.from({ length: nn }, (_, k) => Math.PI / 2 + 2 * Math.PI * k / nn);   // 下の辺から時計回り
  const vs = phis.map(p => [Math.cos(p - a), Math.sin(p - a)]);
  const xs = vs.map(v => v[0]), ys = vs.map(v => v[1]);
  const R = Math.min(W * 0.9 / (Math.max(...xs) - Math.min(...xs)), H * 0.9 / (Math.max(...ys) - Math.min(...ys)));
  const ox = W / 2 - R * (Math.max(...xs) + Math.min(...xs)) / 2, oy = H / 2 - R * (Math.max(...ys) + Math.min(...ys)) / 2;
  const ri = R * Math.cos(a), sl = 2 * R * Math.sin(a), L = ri * (nn === 3 ? 1.4 : 1.15);
  return { cx: ox, cy: oy, sun: ri * 0.42, verts: vs.map(v => [ox + R * v[0], oy + R * v[1]]), frames: phis.map((p, k) => ({
    k, j: nv <= 1 ? 0 : k, M: [ox + ri * Math.cos(p), oy + ri * Math.sin(p)], dir: [Math.sin(p), -Math.cos(p)], nrm: [-Math.cos(p), -Math.sin(p)], sl, L,
    sym: nv <= 1 })) };
}
function symm(v) { const m = v.length, out = new Array(m); for (let i = 0; i < m; i++) { const x = Math.abs((i + 0.5) / m * 2 - 1); out[i] = v[Math.min(m - 1, Math.floor(x * m))]; } return out; }
function shapesSide(G, F, vals, hMul, fill, cap, peak, curve) {
  if (F.sym) { vals = symm(vals); curve = curve ? symm(curve) : curve; }
  const { u, f, style } = G, n = vals.length, rev = !!F.rev;
  const [Mx, My] = F.M, [dx, dy] = F.dir, [nx, ny] = F.nrm, sl = F.sl, Lh = F.L * hMul;
  const pt = (sp, h) => `${f(Mx + dx * sp + nx * h)},${f(My + dy * sp + ny * h)}`;
  const pos = (i, m) => ((rev ? m - 1 - i : i) + 0.5) / m * sl - sl / 2;
  const out = (d, color) => d ? `<path d="${d}" fill="${color}"/>` : '';
  if (style === 'area' || style === 'line') {
    const m = Math.max(24, n * 2), v2 = barsFrom(curve || vals, m), tops = v2.map((v, i) => pt(pos(i, m), v * Lh));
    const e0 = rev ? sl / 2 : -sl / 2, path = `M${pt(e0, 0)} L${tops.join(' L')} L${pt(-e0, 0)} Z`;
    if (style === 'line') return `<path d="${path}" fill="${fill}" opacity="0.12"/><path d="M${tops.join(' L')}" fill="none" stroke="${fill}" stroke-width="${f(2 * u)}" stroke-linejoin="round"/>`;
    let r = `<path d="${path}" fill="${fill}"/>`;
    if (cap) {
      const cid = 'cp' + Math.random().toString(36).slice(2, 8), c0 = 0.62 * Lh;
      r += `<clipPath id="${cid}"><path d="${path}"/></clipPath><path d="M${pt(-sl, c0)} L${pt(sl, c0)} L${pt(sl, Lh * 2)} L${pt(-sl, Lh * 2)} Z" fill="${cap}" clip-path="url(#${cid})"/>`;
    }
    return r;
  }
  const wr = style === 'bar' ? 0.6 : style === 'block' ? 0.78 : 0.7, hw = sl / n * wr / 2;
  const quad = (sp, h0, h1) => `M${pt(sp - hw, h0)}L${pt(sp + hw, h0)}L${pt(sp + hw, h1)}L${pt(sp - hw, h1)}Z`;
  let body = '', caps = '', peaks = '';
  vals.forEach((v, i) => {
    const sp = pos(i, n), b = v * Lh;
    if (style === 'bar') { if (b > 0.2) body += quad(sp, 0, b); }
    else if (style === 'block') { const seg = Math.max(2.4 * u, sl / n * 0.5), p = seg * 1.45; for (let y = 0; y + seg <= b; y += p) body += quad(sp, y, y + seg); }
    else if (style === 'dot') {
      const r = hw * 0.84, p = r * 2.5;
      for (let y = p / 2; y <= b; y += p) { const c = pt(sp, y).split(',').map(Number); body += `M${f(c[0] + r)},${f(c[1])}a${f(r)},${f(r)} 0 1 0 ${f(-2 * r)},0a${f(r)},${f(r)} 0 1 0 ${f(2 * r)},0Z`; }
    }
    if (cap && style !== 'dot') { const L = G.capFrom(i, Lh); if (b > L) caps += quad(sp, L, b); }
    if (peak && v > 0.02) peaks += quad(sp, b + 4 * u, b + 6.4 * u);
  });

}
function fileName() {
  const d = new Date(), p = v => String(v).padStart(2, '0');

  return `${nm}_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.png`;
}
async function openDone() {
  commit(); setStep(3);
  $('dNote').textContent = '画像をつくっています…'; $('donePv').removeAttribute('src'); $('done').classList.add('show');
  $('dSave').disabled = true;
  try {
    doneBlob = await exportPNG(2); doneName = fileName();
    if (doneURL) URL.revokeObjectURL(doneURL); doneURL = URL.createObjectURL(doneBlob);
    $('donePv').src = doneURL; $('dNote').textContent = ''; $('dSave').disabled = false;
  } catch (e) { $('dNote').textContent = '画像をつくれませんでした。もう一度お試しください'; }
}
$('save').addEventListener('click', openDone);
$('dBack').addEventListener('click', () => { $('done').classList.remove('show'); setStep(2); });
$('dPost').addEventListener('click', () => { $('dNote').textContent = '投稿は展示の会期中に使えるようになります'; });
$('dSave').addEventListener('click', async () => {
  if (!doneBlob) return;
  const dl = await dlP;
  if (dl) {
    try { await dl.save({ filename: doneName, data: doneBlob }); $('dNote').textContent = '保存しました'; }
    catch (e) {
      const c = e && e.code;
      $('dNote').textContent = c === 'declined' ? '保存をキャンセルしました' : c === 'rate_limited' ? '少し待ってからもう一度押してください'
        : '保存できませんでした。上の画像を長押し（パソコンは右クリック）して保存してください';
    }
    return;
  }
  const a = document.createElement('a'); a.href = doneURL; a.download = doneName; document.body.appendChild(a); a.click(); a.remove();   // 普通のダウンロード
  $('dNote').textContent = '保存しました（うまくいかないときは、上の画像を長押し／右クリックで保存）';

let layersSig = '';
const miniCache = new Map();
function miniCached(L) { const k = L.id + ':' + L.pal; if (!miniCache.has(k)) miniCache.set(k, miniSVG(L.curve, L.pal, 160, 26, 48)); return miniCache.get(k); }
function renderLayers(force) {
  const sig = JSON.stringify([layers.map(L => [L.id, L.pal, L.on]), openPal]);
  if (!force && sig === layersSig) return; layersSig = sig;
  $('layerCount').textContent = `${layers.length} / ${MAXL}`;
  $('addSound').style.display = layers.length >= MAXL ? 'none' : '';
  $('layers').innerHTML = layers.map((L, i) => {
    const c = PALS[L.pal].c;
    return `<div class="layer${L.on ? '' : ' off'}" data-i="${i}">
      <button class="sw" data-a="pal" title="色を変える" style="background:linear-gradient(135deg, ${c[0]}, ${c[1]})" title="色"></button>
      <div class="lt">${miniCached(L)}<span>${i === 0 ? '手前　' : ''}${SRC_NAME[L.src] || ''} · ${Math.round(L.peakHz).toLocaleString()} Hz</span></div>
      <button class="ib" data-a="eye" title="表示する／隠す">${L.on ? '◉' : '○'}</button>
      <button class="ib" data-a="up" title="手前へ"${i === 0 ? ' disabled style="opacity:.3"' : ''}>↑</button>
      <button class="ib" data-a="del" title="このレイヤーを消す">×</button>
      <input type="range" min="0.3" max="1.4" step="0.01" value="${L.h}" data-a="h" title="このレイヤーの高さ" aria-label="高さ">
      ${openPal === L.id ? `<div class="pals">${PALS.map((p, k) => `<button data-a="setpal" data-p="${k}" class="${k === L.pal ? 'on' : ''}" title="${p.n}" style="background:linear-gradient(135deg, ${p.c[0]}, ${p.c[1]})"></button>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
  $('layers').querySelectorAll('.layer').forEach(row => {
    const i = +row.dataset.i, L = layers[i];
    row.querySelectorAll('[data-a]').forEach(el => {
      const a = el.dataset.a;
      if (a === 'h') { el.addEventListener('input', () => { L.h = +el.value; render(true); }); el.addEventListener('change', () => commit()); return; }
      el.addEventListener('click', () => {
        if (a === 'pal') { openPal = openPal === L.id ? -1 : L.id; renderLayers(); return; }
        change(() => {
          if (a === 'eye') L.on = !L.on;
          if (a === 'up' && i > 0) { layers.splice(i, 1); layers.splice(i - 1, 0, L); }
          if (a === 'del') { layers.splice(i, 1); }
          if (a === 'setpal') L.pal = +el.dataset.p;
        });
        if (!layers.length) $('addSound').click();
      });
    });
  });
}
function syncUI() {
  const on = (box, k) => $(box).querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  on('layout', S.layout); on('style', S.style); on('aspect', S.aspect); on('bgs', S.bg);
  if (S.bg !== 'custom') $('picker').classList.remove('show');
  $('zoom').value = fromZoom(S.zoom); $('time').value = S.time; $('weather').value = S.weather;
  if (S.bg !== 'photo') $('imgPanel').classList.remove('show');
  $('bgs').querySelector('[data-k=photo]').style.background = bgSwatch('photo');
  $('imgs').querySelectorAll('button').forEach(b => b.classList.toggle('on', S.bg === 'photo' && b.dataset.k === S.bgPick));
  $('bgs').querySelector('[data-k=sky]').style.background = bgSwatch('sky');
  hsv = hex2hsv(S.bgColor); syncPicker();
  const off = { refl: S.layout !== 'h', grid: S.layout !== 'h', axis: S.layout === 'r' };   // 使えないエフェクトはグレーに
  $('fx').querySelectorAll('button').forEach(b => { b.classList.toggle('on', !!S.fx[b.dataset.k]); b.disabled = !!off[b.dataset.k]; });
  $('count').value = S.count; $('countOut').textContent = S.count; $('name').value = S.name;
  renderLayers();
}
let pending = false, layersOnly = false;
function render(keepPanel) {
  if (!keepPanel) syncUI();
  if (pending) return; pending = true;
  requestAnimationFrame(() => {
    pending = false;
    const A = ASPECTS[S.aspect];
    $('art').innerHTML = renderArt(S, layers, { id: 'a', caption: true });
    fitArt(A.w / A.h);
  });
}
function fitArt(r) {   // 画面に収まる大きさに
  const wrap = $('stageWrap'), cs = getComputedStyle(wrap);
  const aw = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), ah = (innerWidth <= 860 ? innerHeight * 0.62 : wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom));
  let w = aw, h = w / r; if (h > ah) { h = ah; w = h * r; }
  $('art').style.width = w + 'px'; $('art').style.height = h + 'px';
}
addEventListener('resize', () => { if ($('design').classList.contains('show')) render(true); });

// ---------- ランダム：色・かたち・バー・背景・エフェクトを配置しなおす ----------
function randomize() {
  const r = Math.random, w = (obj) => { let t = 0; for (const k in obj) t += obj[k]; let x = r() * t; for (const k in obj) { x -= obj[k]; if (x <= 0) return k; } return Object.keys(obj)[0]; };
  change(() => {
    const bgs = { sky: 7, black: 2, paper: 1.6, white: 1, photo: 2.2 };
    bgs.custom = 1.6; S.bg = w(bgs);
    if (S.bg === 'photo') { const ks = Object.keys(IMG); S.bgPick = ks[Math.floor(r() * ks.length)]; }
    S.time = [0, 0.2, 0.333, 0.5, 0.667, 0.85, 1, 1][Math.floor(r() * 8)]; S.weather = r() < 0.7 ? r() * 0.25 : 0.3 + r() * 0.6;
    if (S.bg === 'custom') S.bgColor = hsv2hex(r() * 360, 0.25 + r() * 0.65, r() < 0.6 ? 0.08 + r() * 0.3 : 0.55 + r() * 0.4);   // ランダムな色
    const dark = bgOf(S).dark;
    S.layout = w({ h: 6, p: 3, r: 2 });
    S.style = w({ bar: 4, block: 2, dot: 1.4, area: 2, line: 1.4 });
    S.count = [32, 48, 64, 80, 100, 100, 128, 160][Math.floor(r() * 8)];
    S.zoom = r() < 0.55 ? 1 : +(0.8 + r() * 0.9).toFixed(2);
    S.sunX = [0.5, 0.3, 0.7][Math.floor(r() * 3)];
    const pool = PALS.map((_, k) => k).filter(k => dark ? k !== 11 : (k !== 10 && k !== 4));
    for (let k = pool.length - 1; k > 0; k--) { const j = Math.floor(r() * (k + 1)); [pool[k], pool[j]] = [pool[j], pool[k]]; }
    layers.forEach((L, i) => { L.pal = pool[i % pool.length]; L.h = i === 0 ? 0.8 + r() * 0.35 : 0.55 + r() * 0.75; });
    const p = { glow: dark ? 0.6 : 0.08, refl: 0.6, grid: dark ? 0.35 : 0.2, stars: dark ? 0.35 : 0.1, sun: 0.25, cap: 0.35, peak: 0.3, echo: 0.25, ink: dark ? 0.1 : 0.45, scan: 0.15, grain: 0.25, axis: 0.5 };
    for (const k in p) S.fx[k] = r() < p[k];

}
