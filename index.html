<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>AudioSpectGraphic — 音からビジュアルをつくる</title>
<style>
  :root { --ink: #ece6dd; --bg: #05070f; --line: rgba(255,255,255,.14); --paper: #f4f1ec; --navy: #0b1430; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  button { font: inherit; cursor: pointer; color: inherit; }
  button[disabled] { opacity: .4; cursor: default; }
  header { flex: none; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; padding-top: env(safe-area-inset-top); box-sizing: content-box; }
  .brand b { font-size: 14px; letter-spacing: .06em; font-weight: 600; display: block; }
  .brand span { font-size: 10.5px; letter-spacing: .14em; opacity: .65; }
  .hlink { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; font-size: 12px; letter-spacing: .06em; }
  body.intro .hlink, body.playing .hlink { visibility: hidden; }

  /* ---------- 画面 ---------- */
  #stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
  #frame { position: relative; overflow: hidden; border-radius: 4px; box-shadow: 0 24px 70px rgba(0,0,0,.55); background: #000; flex: none; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #frame::after { content: ''; position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #frame.shutter::after { animation: shutter .38s ease-out; }
  @keyframes shutter { 0% { opacity: .75; } 100% { opacity: 0; } }
  .flyShot { position: fixed; z-index: 60; pointer-events: none; transform-origin: 50% 50%; box-shadow: 0 10px 40px rgba(0,0,0,.5); object-fit: cover; }

  /* ---------- 下の操作 ---------- */
  #dock { flex: none; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); }
  body.intro #dock { visibility: hidden; }
  #play { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #prog { width: min(560px, 100%); display: flex; gap: 3px; position: relative; padding: 10px 0; margin: -10px 0; cursor: pointer; -webkit-user-select: none; user-select: none; }
  #prog:hover span { border-top-color: rgba(255,255,255,.3); }
  #prog span { border-top: 2px solid rgba(255,255,255,.16); opacity: .45; transition: opacity .5s; }
  #prog span.on { opacity: 1; }
  #fill { position: absolute; left: 0; top: 10px; width: 100%; height: 2px; background: var(--paper); transform-origin: 0 0; transform: scaleX(0); pointer-events: none; }
  #playRow { display: flex; align-items: center; gap: 18px; width: min(460px, 100%); }
  #playRow .side { flex: 1; display: flex; justify-content: flex-end; }
  .hint { margin: 0; font-size: 11.5px; letter-spacing: .06em; opacity: .6; line-height: 1.6; white-space: nowrap; }
  #playRow .hint.side { justify-content: flex-start; display: block; }
  #capBtn, #resumeBtn { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--paper); background: rgba(255,255,255,.08); color: #fff; font-size: 11px; letter-spacing: 0; padding: 0; white-space: nowrap;
             box-shadow: 0 0 0 6px rgba(244,241,236,.12), inset 0 0 0 6px rgba(5,7,15,.55), 0 10px 30px rgba(0,0,0,.4); flex: none; position: relative; }
  #capBtn::before { content: ''; position: absolute; inset: 9px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.95), rgba(236,230,221,.82)); z-index: -1; }
  #capBtn { color: var(--navy); font-weight: 600; isolation: isolate; }
  #capBtn:active { transform: scale(.95); }
  #resumeBtn { display: none; background: var(--paper); color: var(--navy); }
  body.paused #capBtn { display: none; }
  body.paused #resumeBtn { display: block; }
  #zkBtn { display: flex; flex-direction: column; align-items: center; gap: 1px; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 14px; padding: 7px 12px 6px; min-width: 66px; position: relative; }
  #zkBtn b { font-size: 11.5px; letter-spacing: .12em; font-weight: 600; }
  #zkBtn small { font-size: 10px; opacity: .65; letter-spacing: .04em; }
  #zkBtn.hasNew::after { content: ''; position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: #ffd66b; box-shadow: 0 0 10px #ffd66b; }
  #zkBtn.bump { animation: bump .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.22); box-shadow: 0 0 24px rgba(255,214,107,.6); } 100% { transform: scale(1); } }

  /* ---------- 図鑑（うしろの音とビジュアルは動いたまま） ---------- */
  #zukan { position: fixed; inset: 0; z-index: 25; display: none; align-items: flex-end; justify-content: center; background: linear-gradient(to bottom, rgba(3,5,12,0), rgba(3,5,12,.55) 30%); }
  #zukan.show { display: flex; }
  #zukan .zbox { width: min(760px, 100%); height: min(80vh, 100%); height: min(80dvh, 100%); background: rgba(7,10,22,.84); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
                 border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; animation: zup .32s cubic-bezier(.2,.9,.3,1); }
  @keyframes zup { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  #zukan .zh { display: flex; align-items: center; gap: 12px; padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
  #zukan .zh b { font-size: 15px; letter-spacing: .2em; font-weight: 600; }
  #zukan .zh small { opacity: .65; font-size: 12px; letter-spacing: .06em; }
  #zukan .zh .sp { flex: 1; }
  #zkClose { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: none; font-size: 18px; line-height: 1; }
  #zkBody { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 18px calc(18px + env(safe-area-inset-bottom)); }
  #zkGrid h3 { font-size: 12.5px; letter-spacing: .16em; font-weight: 600; margin: 16px 0 8px; display: flex; align-items: baseline; gap: 10px; }
  #zkGrid h3 small { font-weight: 400; opacity: .55; font-size: 11px; letter-spacing: .04em; }
  .zg { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .zt { position: relative; aspect-ratio: 1; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; overflow: hidden; padding: 0; background: radial-gradient(circle at 50% 35%, #141a33, #080b17);
        display: flex; align-items: center; justify-content: center; }
  .zt[disabled] { opacity: 1; cursor: default; }
  .zt span { font-size: 11px; letter-spacing: .04em; line-height: 1.4; padding: 0 6px; text-align: center; opacity: .42; }
  .zt.got span { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 6px 5px; opacity: 1; background: linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,0)); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zt img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .zt.new { border-color: #ffd66b; box-shadow: 0 0 0 1px #ffd66b inset, 0 0 16px rgba(255,214,107,.35); }
  .zt.new::after { content: 'NEW'; position: absolute; top: 5px; left: 5px; font-size: 9px; letter-spacing: .1em; font-weight: 700; color: var(--navy); background: #ffd66b; border-radius: 999px; padding: 1px 6px; }
  .zEmpty { font-size: 12px; opacity: .5; margin: 0 0 8px; }
  #zkDetail { display: none; padding-top: 12px; }
  #zukan.detail #zkGrid { display: none; }
  #zukan.detail #zkDetail { display: block; }
  #zdBack { padding: 7px 14px; font-size: 12.5px; }
  #zdImg { display: block; max-width: 100%; max-height: 46vh; margin: 12px auto 8px; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .zdCap { text-align: center; margin-bottom: 10px; }
  .zdCap b { font-size: 15px; letter-spacing: .12em; font-weight: 600; display: block; }
  .zdCap small { font-size: 11px; opacity: .55; letter-spacing: .04em; }
  #title { width: 100%; font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--ink); }
  #title::placeholder { color: rgba(236,230,221,.4); font-size: 13px; }
  .btns { display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; margin-top: 10px; }
  .btns button { padding: 12px 6px; font-size: 14px; }
  .primary { background: var(--paper); color: var(--navy); border: none; border-radius: 999px; padding: 11px 22px; font-size: 14px; letter-spacing: .08em; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
  .ghost { background: rgba(9,15,38,.5); border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 10px 18px; font-size: 13px; letter-spacing: .06em; }
  #postAsk { display: none; margin-top: 10px; }
  #sheet.asking .btns { display: none; }
  #sheet.asking #postAsk { display: block; }
  #postAsk p { font-size: 13px; line-height: 1.75; margin: 0 0 10px; letter-spacing: .04em; }
  #postAsk p small { display: block; opacity: .65; font-size: 11.5px; }
  #postAsk .btns2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
  #postAsk .btns2 button { padding: 12px 8px; font-size: 14px; }
  .note { font-size: 11.5px; line-height: 1.7; opacity: .7; margin: 9px 0 0; min-height: 1.7em; letter-spacing: .04em; text-align: center; }
  .note.err { color: #ffc9b8; opacity: 1; }

  /* ---------- はじめに ---------- */
  #startOverlay { position: fixed; inset: 0; z-index: 15; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(3,5,12,.84), rgba(3,5,12,.55)); }
  body:not(.intro) #startOverlay { display: none; }
  #startOverlay .box { text-align: center; padding: 0 22px; max-width: 640px; }
  #startOverlay h1 { font-size: 28px; letter-spacing: .06em; font-weight: 600; margin: 0 0 6px; }
  #startOverlay h2 { font-size: 13px; letter-spacing: .2em; font-weight: 400; margin: 0 0 18px; opacity: .8; }
  #startOverlay p { font-size: 13px; line-height: 1.95; opacity: .88; margin: 0 0 24px; letter-spacing: .05em; }
  #startOverlay p small { display: block; opacity: .7; font-size: 11.5px; margin-top: 6px; }
  .picks { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .songPick { background: var(--paper); color: var(--navy); border: none; border-radius: 16px; padding: 14px 12px; width: 168px; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
  .songPick b { display: block; font-size: 17px; letter-spacing: .2em; font-weight: 600; }
  .songPick small { display: block; font-size: 10.5px; letter-spacing: .08em; opacity: .65; margin-top: 3px; }
  .songPick[data-song="hoshi"] { background: linear-gradient(160deg, #1a2350, #0b1030); color: var(--ink); border: 1px solid rgba(255,255,255,.35); }
  .songPick[data-song="wa"] { background: linear-gradient(160deg, #b3191f, #6e0d12); color: #fff3df; border: 1px solid rgba(255,220,170,.45); }
  .songPick[hidden] { display: none; }
  #pickHint { font-size: 11.5px; letter-spacing: .05em; opacity: .55; margin: 14px 0 0; }
  #songBtn[hidden] { display: none !important; }
  .zt.locked span { opacity: .28; letter-spacing: .2em; }
  #songBtn { display: none; }
  body.playing #songBtn { display: inline-block; visibility: visible; }
  #loadMsg { font-size: 12px; opacity: .7; margin-top: 12px; min-height: 1.5em; letter-spacing: .04em; }
  #loadMsg.err { color: #ffc9b8; opacity: 1; }
  .linkbtn { background: none; border: 0; color: var(--ink); opacity: .75; font-size: 13px; letter-spacing: .08em; margin-top: 10px; text-decoration: underline; text-underline-offset: 4px; }

  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: var(--paper); color: var(--navy); font-size: 13px;
           padding: 10px 18px; border-radius: 999px; opacity: 0; transition: .3s; pointer-events: none; z-index: 50; letter-spacing: .04em; text-align: center; max-width: 90vw; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 600px) {
    header { padding-left: 14px; padding-right: 14px; }
    .brand b { font-size: 13px; letter-spacing: .04em; }
    #startOverlay h1 { font-size: 24px; letter-spacing: .04em; }
    #startOverlay p br { display: none; }
    .hint { font-size: 10.5px; letter-spacing: .03em; }
    #playRow { gap: 14px; }
  }

  @media (orientation: landscape) and (max-height: 540px) {   /* スマホを横にしたとき：操作は右側に */
    body { display: grid; grid-template-columns: 1fr 240px; grid-template-rows: auto 1fr; }
    header { grid-column: 1 / -1; height: 40px; }
    #stage { grid-row: 2; grid-column: 1; padding-left: env(safe-area-inset-left); }
    #dock { grid-row: 2; grid-column: 2; display: flex; align-items: center; padding: 6px calc(14px + env(safe-area-inset-right)) 10px 4px; }
    #play { width: 100%; }
    #playRow { flex-direction: column; gap: 10px; width: 100%; }
    #playRow .hint, #playRow .hint:first-child { text-align: center; flex: none; }
    #playRow .hint br { display: none; }
    #prog span { color: transparent; }
    #prog span.on { color: inherit; overflow: visible; }
    #zukan .zbox { height: 100%; border-radius: 0; }
    #zdImg { max-height: 38vh; }
  }

  /* ---------- ギャラリー ---------- */
  #gallery { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; display: none; -webkit-overflow-scrolling: touch; }
  #gallery.show { display: block; }
  #gallery .gh { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: rgba(5,7,15,.92);
                 -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  #gallery .gh b { font-size: 15px; letter-spacing: .2em; font-weight: 600; }
  #gallery .gh small { opacity: .6; font-size: 12px; letter-spacing: .06em; }
  #gallery .gh .sp { flex: 1; }
  #gallery .gh .adm { font-size: 11px; color: var(--navy); background: #ffd66b; border-radius: 999px; padding: 3px 9px; letter-spacing: .06em; }
  #gClose { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: none; font-size: 18px; line-height: 1; }
  #gGrid { columns: 4 220px; column-gap: 12px; padding: 16px 20px 8px; }
  .gi { break-inside: avoid; margin: 0 0 12px; display: block; width: 100%; padding: 0; border: 0; background: #0e1326; border-radius: 10px; overflow: hidden; text-align: left; }
  .gi img { display: block; width: 100%; height: auto; background: #0b0f1e; }
  .gi span { display: block; padding: 7px 10px 8px; font-size: 12px; letter-spacing: .04em; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #gMsg { text-align: center; padding: 30px 20px 10px; font-size: 13px; opacity: .7; line-height: 1.9; letter-spacing: .05em; }
  #gMore { display: block; margin: 6px auto 40px; }
  #gMore[hidden] { display: none; }
  #gView { position: fixed; inset: 0; z-index: 40; background: rgba(3,5,12,.94); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 14px; }
  #gView.show { display: flex; }
  #gView img { max-width: 100%; max-height: calc(100vh - 170px); border-radius: 8px; display: block; background: #0b0f1e; }
  #gView .cap { text-align: center; font-size: 14px; letter-spacing: .06em; line-height: 1.6; }
  #gView .cap small { display: block; opacity: .55; font-size: 11.5px; }
  #gView .row { display: flex; gap: 10px; }
  #gDel { border-color: #ff9a8a; color: #ffc9b8; }
  #gAdmin { display: none; padding: 0 20px 12px; gap: 8px; align-items: center; font-size: 12px; }
  #gallery.askadmin #gAdmin { display: flex; }
  #gAdmin input { flex: 1; max-width: 260px; background: #0e1326; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 8px 10px; font: inherit; }
  @media (max-width: 600px) {
    #gGrid { columns: 2 140px; column-gap: 8px; padding: 12px 12px 6px; }
    .gi { margin-bottom: 8px; }
    #gallery .gh { padding: 12px 14px; }
  }
</style>
</head>
<body class="intro">
<header>
  <div class="brand"><b>AudioSpectGraphic</b><span>音からビジュアルをつくる</span></div>
  <span><button class="hlink" id="songBtn">♪ 星座の曲へ</button> <button class="hlink" id="hGal" hidden>みんなの作品</button></span>
</header>

<main id="stage">
  <div id="frame">
    <canvas id="gl"></canvas>
  </div>
</main>

<div id="dock">
  <div id="play">
    <div id="prog" title="押すと、そのパートの最初にもどります"><i id="fill"></i></div>
    <div id="playRow">
      <div class="side"><button id="zkBtn" aria-label="図鑑をひらく"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5A1.5 1.5 0 0 1 4 17.5zM13 4h5.5c.8 0 1.5.7 1.5 1.5v12c0 .8-.7 1.5-1.5 1.5H13z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><b>図鑑</b><small id="zkCount">0/0</small></button></div>
      <button id="capBtn">キャプチャー</button>
      <button id="resumeBtn">つづける</button>
      <p class="hint side">形をキャプチャーして<br>図鑑をうめよう</p>
    </div>
  </div>
</div>

<div id="zukan">
  <div class="zbox">
    <div class="zh"><b>図鑑</b><small id="zkHead"></small><span class="sp"></span><button id="zkClose" aria-label="閉じる">×</button></div>
    <div id="zkBody">
      <div id="zkGrid"></div>
      <div id="zkDetail">
        <button class="ghost" id="zdBack">‹ 図鑑にもどる</button>
        <img id="zdImg" alt="">
        <div class="zdCap"><b id="zdName"></b><small id="zdDate"></small></div>
        <div id="sheet">
          <input id="title" maxlength="24" placeholder="タイトル（なしでもOK・画像の左下に入ります）" enterkeyhint="done" autocomplete="off">
          <div class="btns">
            <button class="primary" id="sSave">保存</button>
            <button class="ghost" id="sPost">投稿</button>
          </div>
          <div id="postAsk">
            <p>この作品を「みんなの作品」ギャラリーに公開しますか？<small id="postTitle"></small><small>公開した作品は、会場やほかの人のスマホからも見られます</small></p>
            <div class="btns2"><button class="primary" id="pYes">公開する</button><button class="ghost" id="pNo">やめる</button></div>
          </div>
          <p class="note" id="sNote"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="startOverlay">
  <div class="box">
    <h1>AudioSpectGraphic</h1>
    <h2>音からビジュアルをつくる</h2>
    <p>音楽に合わせて、音のスペクトラム（低い音から高い音までの大きさ）が<br>形を変えつづけ、ビジュアルが自動でつくられていきます。同じ絵は二度と出ません。<br>いろいろな形を「キャプチャー」して、図鑑をうめましょう。<br>図鑑から、タイトルを付けて保存・投稿できます。<small>※ 音が出ます</small></p>
    <div class="picks">
      <button class="songPick" data-song="fuji" disabled><b>富士山</b><small>シンセウェイブ・112BPM</small></button>
      <button class="songPick" data-song="hoshi" disabled hidden><b>星座</b><small>星空・96BPM</small></button>
      <button class="songPick" data-song="wa" disabled hidden><b>和</b><small>琴と太鼓・80BPM</small></button>
    </div>
    <p id="pickHint"></p>
    <div id="loadMsg"></div>
    <button class="linkbtn" id="galFromStart" hidden>みんなの作品を見る</button>
  </div>
</div>

<div id="gallery">
  <div class="gh"><b>みんなの作品</b><small id="gCount"></small><span class="sp"></span><span class="adm" id="gAdmBadge" hidden>管理モード</span><button id="gClose" aria-label="閉じる">×</button></div>
  <div id="gAdmin"><span>管理者パスワード</span><input id="gAdmKey" type="password" autocomplete="off"><button class="ghost" id="gAdmOk">入る</button></div>
  <div id="gGrid"></div>
  <p id="gMsg"></p>
  <button class="ghost" id="gMore" hidden>もっと見る</button>
</div>
<div id="gView">
  <img id="gvImg" alt="">
  <div class="cap"><span id="gvTitle"></span><small id="gvDate"></small></div>
  <div class="row"><button class="ghost" id="gvClose">閉じる</button><button class="ghost" id="gDel" hidden>この投稿を消す</button></div>
</div>
<div id="toast"></div>

<script>
// =====================================================
//  AudioSpectGraphic（音からビジュアルをつくる）
//  オリジナル曲が流れ、そのスペクトラムからビジュアルが自動でつくられていく。
//  地平線・円・多角形・螺旋（DNA）・時間の奥行き（3Dの山脈・トンネル）…を、すべて途中の値でつないで
//  曲の展開に合わせて切れ目なく変形させる。組み合わせは毎回ちがうので、同じ絵は二度と出ない。
//  好きな瞬間で「とめる」→ タイトル → 保存・投稿。とめた画面と保存される画像は同じ状態を描いたもの。

async function makePostImages(url) {   // 拡大用（長辺1200px）と一覧用（長辺480px）に縮めて圧縮
  const img = new Image(); img.src = url; await img.decode();
  const draw = (src, sw, sh, long) => {
    const k = Math.min(1, long / Math.max(sw, sh)), c = document.createElement('canvas');
    c.width = Math.round(sw * k); c.height = Math.round(sh * k);
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(src, 0, 0, c.width, c.height); return c;
  };
  const enc = async (c, max) => {
    for (const q of [0.76, 0.66, 0.56, 0.46]) {
      let b = await new Promise(r => c.toBlob(r, 'image/webp', q));
      if (!b || b.type !== 'image/webp') b = await new Promise(r => c.toBlob(r, 'image/jpeg', q + 0.08));   // WebPを作れないブラウザ（Safariなど）はJPEG
      if (b && b.size <= max) return b;
    }
    throw new Error('too_large');
  };
  const cf = draw(img, img.naturalWidth, img.naturalHeight, 1200), ct = draw(cf, cf.width, cf.height, 480);
  return { full: await enc(cf, 600000), thumb: await enc(ct, 140000), w: cf.width, h: cf.height };
}

const PAGE = 24;
const imgURL = (p, thumb) => `${SB_URL}/storage/v1/object/public/posts/${p.id}${thumb ? '_t' : ''}.${p.ext}`;
function fmtDate(iso) { const d = new Date(iso), p = v => String(v).padStart(2, '0'); return `${md(d)} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function tile(p) {
  const b = document.createElement('button'); b.className = 'gi';
  const im = document.createElement('img'); im.loading = 'lazy'; im.decoding = 'async'; im.alt = p.title || '作品';
  im.width = 480; im.height = Math.round(480 * p.h / p.w); im.src = imgURL(p, true);
  b.appendChild(im);
  if (p.title) { const t = document.createElement('span'); t.textContent = p.title; b.appendChild(t); }
  b.addEventListener('click', () => openView(p));

}
async function loadMore(reset) {
  if (GAL.loading) return; GAL.loading = true;
  if (reset) { GAL.items = []; $('gGrid').innerHTML = ''; }
  $('gMore').hidden = true; $('gMsg').textContent = '読み込んでいます…';
  try {
    const r = await fetch(`${SB_URL}/rest/v1/posts?select=id,created_at,title,ext,w,h&order=created_at.desc&limit=${PAGE}&offset=${GAL.items.length}`,
      { headers: { apikey: SB_KEY, Prefer: 'count=exact' } });
    if (!r.ok) throw new Error('load');
    const rows = await r.json();
    GAL.total = +((r.headers.get('content-range') || '').split('/')[1]) || GAL.items.length + rows.length;
    const frag = document.createDocumentFragment(); rows.forEach(p => frag.appendChild(tile(p)));
    $('gGrid').appendChild(frag); GAL.items.push(...rows);
    $('gCount').textContent = GAL.total ? `${GAL.total}件` : '';
    $('gMsg').textContent = GAL.items.length ? '' : (postState() === 'before' ? `ギャラリーは ${periodText()} の会期中に公開されます` : 'まだ投稿はありません。最初の1枚をどうぞ');
    $('gMore').hidden = GAL.items.length >= GAL.total;

  GAL.loading = false;
}
